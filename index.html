<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>parseomatic</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="toolbar">
      <button id="open-file-btn" class="toolbar-btn" title="Open combat log...">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
          ></path>
        </svg>
      </button>
      <button id="new-window-btn" class="toolbar-btn" title="New window for this file">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="14" rx="2"></rect>
          <path d="M12 9v6M9 12h6"></path>
        </svg>
      </button>
    </div>
    <main class="content">
      <p id="log-status" class="placeholder">No combat log open</p>
    </main>
  </body>
</html>
