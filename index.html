<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>parseomatic</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="toolbar">
      <div class="toolbar-group">
        <button id="open-file-btn" class="toolbar-btn" title="Open combat log...">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
            ></path>
          </svg>
        </button>
        <button id="new-window-btn" class="toolbar-btn" title="New window for this file">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="2" y="2" width="14" height="11" rx="2"></rect>
            <path d="M2 6h14"></path>
            <rect x="8" y="11" width="14" height="11" rx="2"></rect>
            <path d="M8 15h14"></path>
          </svg>
        </button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <button
          id="view-debug-btn"
          class="toolbar-btn"
          data-view="debug"
          title="Debug view"
          aria-pressed="true"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M8 6 6.5 4.5M16 6l1.5-1.5"></path>
            <rect x="7" y="8" width="10" height="11" rx="5"></rect>
            <path d="M12 8V5M7 12H3M21 12h-4M7 16H4M20 16h-3M9 19l-2 2M15 19l2 2"></path>
          </svg>
        </button>
        <button
          id="view-raw-btn"
          class="toolbar-btn"
          data-view="raw"
          title="Raw log view"
          aria-pressed="false"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 6h16M4 12h10M4 18h13"></path>
          </svg>
        </button>
      </div>
    </div>
    <main id="content" class="content">
      <p id="log-status" class="placeholder">No combat log open</p>
      <div id="debug-view" class="debug-view" hidden>
        <div class="tabs" role="tablist">
          <button class="tab-btn active" data-tab="players" role="tab">Players</button>
          <button class="tab-btn" data-tab="pets" role="tab">Pets</button>
          <button class="tab-btn" data-tab="creatures" role="tab">Creatures</button>
          <button class="tab-btn" data-tab="units" role="tab">Units</button>
          <button class="tab-btn" data-tab="spells" role="tab">Spells</button>
          <button class="tab-btn" data-tab="zones" role="tab">Zones</button>
          <button class="tab-btn" data-tab="encounters" role="tab">Encounters</button>
          <button class="tab-btn" data-tab="deaths" role="tab">Deaths</button>
          <button class="tab-btn" data-tab="gear" role="tab">Gear</button>
        </div>
        <div class="tab-panels">
          <div class="tab-panel" data-panel="players">
            <div id="players-header" class="data-header">
              <span class="data-col">Name</span>
              <span class="data-col">GUID</span>
            </div>
            <p id="players-empty" class="empty-message" hidden></p>
            <div id="players-scroll" class="data-scroll">
              <div id="players-spacer" class="data-spacer"></div>
              <div id="players-rows" class="data-rows"></div>
            </div>
          </div>
          <div class="tab-panel" data-panel="pets" hidden>
            <div id="pets-header" class="data-header">
              <span class="data-col">Name</span>
              <span class="data-col">Kind</span>
              <span class="data-col">Owner</span>
              <span class="data-col">GUID</span>
            </div>
            <p id="pets-empty" class="empty-message" hidden></p>
            <div id="pets-scroll" class="data-scroll">
              <div id="pets-spacer" class="data-spacer"></div>
              <div id="pets-rows" class="data-rows"></div>
            </div>
          </div>
          <div class="tab-panel" data-panel="creatures" hidden>
            <div id="creatures-header" class="data-header">
              <span class="data-col">Name</span>
              <span class="data-col">Kind</span>
              <span class="data-col">Owner</span>
              <span class="data-col">GUID</span>
            </div>
            <p id="creatures-empty" class="empty-message" hidden></p>
            <div id="creatures-scroll" class="data-scroll">
              <div id="creatures-spacer" class="data-spacer"></div>
              <div id="creatures-rows" class="data-rows"></div>
            </div>
          </div>
          <div class="tab-panel" data-panel="units" hidden>
            <div id="units-header" class="data-header">
              <span class="data-col">Name</span>
              <span class="data-col">Kind</span>
              <span class="data-col">Owner</span>
              <span class="data-col">GUID</span>
            </div>
            <p id="units-empty" class="empty-message" hidden></p>
            <div id="units-scroll" class="data-scroll">
              <div id="units-spacer" class="data-spacer"></div>
              <div id="units-rows" class="data-rows"></div>
            </div>
          </div>
          <div class="tab-panel" data-panel="spells" hidden>
            <div id="spells-header" class="data-header">
              <span class="data-col">Name</span>
              <span class="data-col">Spell ID</span>
              <span class="data-col">School</span>
            </div>
            <p id="spells-empty" class="empty-message" hidden></p>
            <div id="spells-scroll" class="data-scroll">
              <div id="spells-spacer" class="data-spacer"></div>
              <div id="spells-rows" class="data-rows"></div>
            </div>
          </div>
          <div class="tab-panel" data-panel="zones" hidden>
            <div id="zones-header" class="data-header">
              <span class="data-col">Name</span>
              <span class="data-col">Map ID</span>
            </div>
            <p id="zones-empty" class="empty-message" hidden></p>
            <div id="zones-scroll" class="data-scroll">
              <div id="zones-spacer" class="data-spacer"></div>
              <div id="zones-rows" class="data-rows"></div>
            </div>
          </div>
          <div class="tab-panel" data-panel="encounters" hidden>
            <div id="encounters-header" class="data-header">
              <span class="data-col">Name</span>
              <span class="data-col">Result</span>
              <span class="data-col">Duration</span>
              <span class="data-col">Group Size</span>
            </div>
            <p id="encounters-empty" class="empty-message" hidden></p>
            <div id="encounters-scroll" class="data-scroll">
              <div id="encounters-spacer" class="data-spacer"></div>
              <div id="encounters-rows" class="data-rows"></div>
            </div>
          </div>
          <div class="tab-panel" data-panel="deaths" hidden>
            <div id="deaths-header" class="data-header">
              <span class="data-col">Player</span>
              <span class="data-col">Encounter</span>
              <span class="data-col">Time</span>
            </div>
            <p id="deaths-empty" class="empty-message" hidden></p>
            <div id="deaths-scroll" class="data-scroll">
              <div id="deaths-spacer" class="data-spacer"></div>
              <div id="deaths-rows" class="data-rows"></div>
            </div>
          </div>
          <div class="tab-panel" data-panel="gear" hidden>
            <div id="gear-header" class="data-header">
              <span class="data-col">Player</span>
              <span class="data-col">Encounter</span>
              <span class="data-col">Spec ID</span>
              <span class="data-col">Avg Item Level</span>
              <span class="data-col">Items</span>
            </div>
            <p id="gear-empty" class="empty-message" hidden></p>
            <div id="gear-scroll" class="data-scroll">
              <div id="gear-spacer" class="data-spacer"></div>
              <div id="gear-rows" class="data-rows"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="raw-view" class="raw-view" hidden>
        <div class="raw-header">
          <span class="raw-col raw-col-time">Time</span>
          <span class="raw-col raw-col-kind">Kind</span>
          <span class="raw-col raw-col-source">Source</span>
          <span class="raw-col raw-col-target">Target</span>
          <span class="raw-col raw-col-spell">Spell</span>
          <span class="raw-col raw-col-details">Details</span>
        </div>
        <div id="raw-scroll" class="raw-scroll">
          <div id="raw-spacer" class="raw-spacer"></div>
          <div id="raw-rows" class="raw-rows"></div>
        </div>
      </div>
    </main>
    <div id="status-bar" class="statusbar" hidden>
      <div class="statusbar-track">
        <div id="statusbar-fill" class="statusbar-fill"></div>
      </div>
      <span id="statusbar-text" class="statusbar-text"></span>
    </div>
  </body>
</html>
